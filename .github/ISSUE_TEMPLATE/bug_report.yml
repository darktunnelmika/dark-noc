name: Bug report
description: Report a reproducible DARK NOC problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, Agent tokens, private keys or unredacted public server details."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.6.2"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Hub installer, Hub panel, Node installer, Agent, DARK Backhaul plugin, SSH terminal]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell

