name: DARK Realm UFW Rollback Hardening

on:
  push:
    branches: ["codex/dark-realm-noc-v2.9.0"]
    paths:
      - ".github/workflows/realm-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply transactional UFW cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/realm-ufw-hardening.py
          python -m py_compile /tmp/realm-ufw-hardening.py
          python /tmp/realm-ufw-hardening.py
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Validate all tests and release build
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          scripts/build-release.sh
      - name: Publish hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/realm-hardening.yml
          git add agent/realm_plugin.py tests/realm_integration.py
          git diff --cached --check
          git commit -m "fix(realm): roll back owned UFW rules on deployment failure"
          git push origin HEAD:codex/dark-realm-noc-v2.9.0
