name: DARK Realm Integration Transaction

on:
  push:
    branches: ["codex/dark-realm-noc-v2.9.0"]
    paths:
      - ".github/workflows/realm-integration.yml"
      - ".realm-bootstrap/payload.xz"

permissions:
  contents: write

# Transaction trigger: import-safe Realm adapter v9.
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and apply verified Realm integration patch
        shell: bash
        run: |
          set -euo pipefail
          cp .realm-bootstrap/payload.xz /tmp/realm-integration.py.xz
          xz -t /tmp/realm-integration.py.xz
          xz -dc /tmp/realm-integration.py.xz > /tmp/integrate_realm_noc.py
          python -m py_compile /tmp/integrate_realm_noc.py
          python /tmp/integrate_realm_noc.py
          python - <<'PY'
          from pathlib import Path

          path = Path("agent/agent.py")
          source = path.read_text(encoding="utf-8")
          old = "from realm_plugin import deploy as deploy_dark_realm, install_core as install_dark_realm, inventory as realm_inventory, remove as remove_dark_realm"
          new = '''try:
              from realm_plugin import deploy as deploy_dark_realm, install_core as install_dark_realm, inventory as realm_inventory, remove as remove_dark_realm
          except ModuleNotFoundError:
              import importlib.util as _realm_importlib_util
              _realm_adapter_path = Path(__file__).resolve().with_name("realm_plugin.py")
              _realm_adapter_spec = _realm_importlib_util.spec_from_file_location("dark_noc_realm_plugin", _realm_adapter_path)
              if _realm_adapter_spec is None or _realm_adapter_spec.loader is None:
                  raise
              _realm_adapter_module = _realm_importlib_util.module_from_spec(_realm_adapter_spec)
              _realm_adapter_spec.loader.exec_module(_realm_adapter_module)
              deploy_dark_realm = _realm_adapter_module.deploy
              install_dark_realm = _realm_adapter_module.install_core
              realm_inventory = _realm_adapter_module.inventory
              remove_dark_realm = _realm_adapter_module.remove'''
          if source.count(old) != 1:
              raise SystemExit("Realm adapter import anchor mismatch")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          rm -rf .realm-bootstrap .github/workflows/realm-integration.yml

      - name: Install project dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py

      - name: Reproducible release validation
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated Realm integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate DARK Realm Pro into DARK NOC v2.9.0"
          git push origin HEAD:codex/dark-realm-noc-v2.9.0
