name: Release

# Explicit source marker: updating this file safely retriggers a missed release run.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dark-noc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve or recover release transaction
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          source_version="$(sed -n 's/^VERSION = "\([0-9][0-9.]*\)"$/\1/p' hub/app.py)"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v$source_version"
          target_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          marker="<!-- dark-noc-release:$release_tag:$target_sha -->"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$release_tag" ]]; then
            echo "Source version $release_tag does not match pushed tag $GITHUB_REF_NAME." >&2
            exit 1
          fi

          all_releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add')"
          release_count="$(jq --arg tag "$release_tag" '[.[] | select(.tag_name == $tag)] | length' <<< "$all_releases")"
          [[ "$release_count" -le 1 ]] || { echo "More than one release uses $release_tag." >&2; exit 1; }
          release_owned_target=""
          if [[ "$release_count" == 1 ]]; then
            release="$(jq -c --arg tag "$release_tag" '.[] | select(.tag_name == $tag)' <<< "$all_releases")"
            release_id="$(jq -r .id <<< "$release")"
            is_draft="$(jq -r .draft <<< "$release")"
            release_body="$(jq -r '.body // ""' <<< "$release")"
            if [[ "$is_draft" == false ]]; then
              echo "Published release $release_tag already exists; nothing to change."
              printf 'publish=false\ntag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            release_owned_target="$(sed -n "s#.*<!-- dark-noc-release:${release_tag}:\([0-9a-f]\{40\}\) -->.*#\1#p" <<< "$release_body" | tail -n 1)"
            if [[ -z "$release_owned_target" ]]; then
              echo "Draft $release_tag is not an owned DARK NOC transaction; refusing to modify it." >&2
              exit 1
            fi
            echo "Recovering owned draft release #$release_id from $release_owned_target."
          else
            release_id=""
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_target="$(git rev-parse "refs/tags/$release_tag^{commit}")"
            tag_type="$(git cat-file -t "refs/tags/$release_tag")"
            tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$release_tag")"
            tag_marker="<!-- dark-noc-release:$release_tag:$tag_target -->"
            if [[ "$tag_type" != tag || "$tag_message" != *"$tag_marker"* ]]; then
              echo "Existing tag $release_tag is not an owned annotated release tag." >&2
              exit 1
            fi
            if [[ "$tag_target" != "$target_sha" ]]; then
              if [[ -n "$release_id" ]]; then
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
                echo "Removed outdated owned draft release #$release_id before moving its tag."
                release_id=""
                release_owned_target=""
              fi
              git tag -d "$release_tag"
              git tag -a "$release_tag" "$target_sha" -m "DARK NOC $release_tag" -m "$marker"
              git push --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
              echo "Moved unpublished owned tag $release_tag to $target_sha."
            fi
          else
            git tag -a "$release_tag" "$target_sha" -m "DARK NOC $release_tag" -m "$marker"
            if ! git push origin "refs/tags/$release_tag:refs/tags/$release_tag"; then
              git tag -d "$release_tag" >/dev/null 2>&1 || true
              git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
              tag_target="$(git rev-parse "refs/tags/$release_tag^{commit}")"
              tag_type="$(git cat-file -t "refs/tags/$release_tag")"
              tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$release_tag")"
              if [[ "$tag_target" != "$target_sha" || "$tag_type" != tag || "$tag_message" != *"$marker"* ]]; then
                echo "Tag creation raced with an unrelated tag; refusing to continue." >&2
                exit 1
              fi
            fi
          fi

          if [[ -n "$release_id" && "$release_owned_target" != "$target_sha" ]]; then
            notes_file="$(mktemp)"
            { cat RELEASE_NOTES.md; printf '\n\n%s\n' "$marker"; } > "$notes_file"
            jq -n --rawfile body "$notes_file" '{body: $body}' | \
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null
            release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            release_body="$(jq -r '.body // ""' <<< "$release")"
            if [[ "$(jq -r .draft <<< "$release")" != true || "$release_body" != *"$marker"* ]]; then
              echo "Could not retarget the owned draft transaction." >&2
              exit 1
            fi
            release_owned_target="$target_sha"
            echo "Retargeted owned draft release #$release_id to $target_sha."
          fi

          if [[ -z "$release_id" ]]; then
            notes_file="$(mktemp)"
            { cat RELEASE_NOTES.md; printf '\n\n%s\n' "$marker"; } > "$notes_file"
            if ! release="$(jq -n \
              --arg tag "$release_tag" \
              --arg target "$target_sha" \
              --arg name "DARK NOC $release_tag" \
              --rawfile body "$notes_file" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: false}' | \
              gh api -X POST "repos/$GITHUB_REPOSITORY/releases" --input -)"; then
              all_releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add')"
              release="$(jq -c --arg tag "$release_tag" '.[] | select(.tag_name == $tag)' <<< "$all_releases")"
              [[ -n "$release" ]] || { echo "Draft creation failed and no recoverable draft exists." >&2; exit 1; }
            fi
            release_id="$(jq -r .id <<< "$release")"
            is_draft="$(jq -r .draft <<< "$release")"
            created_tag="$(jq -r .tag_name <<< "$release")"
            release_body="$(jq -r '.body // ""' <<< "$release")"
            if [[ ! "$release_id" =~ ^[0-9]+$ || "$is_draft" != true || "$created_tag" != "$release_tag" || "$release_body" != *"$marker"* ]]; then
              echo "Created draft does not match the owned release transaction." >&2
              exit 1
            fi
          fi

          printf 'publish=true\ntag=%s\nrelease_id=%s\ntarget_sha=%s\nmarker=%s\n' \
            "$release_tag" "$release_id" "$target_sha" "$marker" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: "22"

      - name: Install test dependencies
        if: steps.version.outputs.publish == 'true'
        run: |
          pip install --disable-pip-version-check --require-hashes -r hub/requirements.lock
          pip install --disable-pip-version-check --require-hashes -r agent/requirements.lock
          pip check

      - name: Test release source
        if: steps.version.outputs.publish == 'true'
        run: |
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/plugin_registry_contract.py
          python tests/runtime_security_contract.py
          python tests/dependency_lock_contract.py
          python tests/github_actions_supply_chain_contract.py

      - name: Build reproducible packages
        if: steps.version.outputs.publish == 'true'
        run: |
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish verified draft
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
          TARGET_SHA: ${{ steps.version.outputs.target_sha }}
          RELEASE_MARKER: ${{ steps.version.outputs.marker }}
        run: |
          set -Eeuo pipefail
          assets=(
            "dist/DARK-NOC-HUB-$RELEASE_TAG.tar.gz"
            "dist/DARK-NOC-NODE-$RELEASE_TAG.tar.gz"
            "dist/SHA256SUMS"
          )
          expected_names=("DARK-NOC-HUB-$RELEASE_TAG.tar.gz" "DARK-NOC-NODE-$RELEASE_TAG.tar.gz" "SHA256SUMS")
          expected_archives=("DARK-NOC-HUB-$RELEASE_TAG.tar.gz" "DARK-NOC-NODE-$RELEASE_TAG.tar.gz")

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          [[ "$(jq -r .tag_name <<< "$release")" == "$RELEASE_TAG" ]]
          [[ "$(jq -r .draft <<< "$release")" == true ]]
          [[ "$(jq -r '.body // ""' <<< "$release")" == *"$RELEASE_MARKER"* ]]
          tag_target="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG")"
          tag_message="$(git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG")"
          [[ "$tag_target" == "$TARGET_SHA" && "$tag_type" == tag && "$tag_message" == *"$RELEASE_MARKER"* ]]

          for asset in "${assets[@]}"; do test -f "$asset"; done
          expected_checksum_names="$(printf '%s\n' "${expected_archives[@]}" | LC_ALL=C sort)"
          actual_checksum_names="$(awk 'NF {print $2}' dist/SHA256SUMS | LC_ALL=C sort)"
          [[ "$actual_checksum_names" == "$expected_checksum_names" ]]
          (cd dist && sha256sum -c SHA256SUMS)

          existing_names="$(jq -r '.assets[].name' <<< "$release")"
          while IFS= read -r existing_name; do
            [[ -z "$existing_name" ]] && continue
            printf '%s\n' "${expected_names[@]}" | grep -Fxq "$existing_name" || {
              echo "Owned draft contains unexpected asset $existing_name; refusing to delete it." >&2
              exit 1
            }
          done <<< "$existing_names"

          for expected_name in "${expected_names[@]}"; do
            asset_id="$(jq -r --arg name "$expected_name" '.assets[] | select(.name == $name) | .id' <<< "$release")"
            if [[ -n "$asset_id" ]]; then
              [[ "$asset_id" != *$'\n'* ]] || { echo "Duplicate draft asset $expected_name." >&2; exit 1; }
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done

          gh release upload "$RELEASE_TAG" "${assets[@]}"
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          actual_names="$(jq -r '.assets[].name' <<< "$release" | LC_ALL=C sort)"
          expected_sorted="$(printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort)"
          [[ "$actual_names" == "$expected_sorted" ]] || { echo "Draft must contain exactly three expected assets." >&2; exit 1; }

          verify_dir="$(mktemp -d)"
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$verify_dir/$asset_name"
          done < <(jq -r '.assets[] | [.id,.name] | @tsv' <<< "$release")
          cmp -- dist/SHA256SUMS "$verify_dir/SHA256SUMS"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .draft)" == false ]]

          all_releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add')"
          marker_prefix="<!-- dark-noc-release:$RELEASE_TAG:"
          while IFS= read -r stale_id; do
            [[ -z "$stale_id" ]] && continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$stale_id"
            echo "Removed owned orphan draft release #$stale_id."
          done < <(jq -r --arg prefix "$marker_prefix" '
            .[] | select(
              .draft == true and
              ((.tag_name // "") | startswith("untagged-")) and
              ((.body // "") | contains($prefix))
            ) | .id
          ' <<< "$all_releases")
