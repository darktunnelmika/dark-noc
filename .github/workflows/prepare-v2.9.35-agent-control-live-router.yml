name: Prepare v2.9.35 Agent Control Plane Router Split

on:
  push:
    branches: [automation/v2.9.35-agent-control-live-router]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preserve preparation source
        run: cp scripts/prepare_v2_9_35.py /tmp/prepare_v2_9_35.py
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Split Agent Control Plane and Live routes
        run: |
          set -Eeuo pipefail
          python /tmp/prepare_v2_9_35.py
          python - <<'PY'
          from pathlib import Path

          # Earlier contracts intentionally pinned control-plane ownership to app.py.
          # Follow the new router boundary while retaining specific state-machine checks.
          for path in Path('tests').glob('*.py'):
              text = path.read_text()
              for stale in [
                  "assert '@app.get(\"/api/agent/jobs\")' in app",
                  "assert '@app.post(\"/api/agent/jobs/result\")' in app",
                  "assert '@app.post(\"/api/agent/jobs/{job_id}/lease\")' in app",
              ]:
                  text = text.replace(stale, "assert \"with_name('agent_control_router.py')\" in app")
              path.write_text(text)

          cert = Path('tests/backend_certificate_fleet_service_contract.py')
          text = cert.read_text()
          needle = 'app = (root / "hub/app.py").read_text()\n'
          if needle not in text:
              raise SystemExit('certificate/fleet contract app anchor not found')
          text = text.replace(
              needle,
              needle + 'agent_control = (root / "hub/agent_control_router.py").read_text()\n',
              1,
          )
          old = 'assert \'if row["kind"] == "certificate_issue":\' in app'
          new = 'assert \'if row["kind"] == "certificate_issue":\' in agent_control'
          if old not in text:
              raise SystemExit('certificate result ownership assertion not found')
          cert.write_text(text.replace(old, new, 1))

          agent_contract = Path('tests/backend_agent_control_router_contract.py')
          text = agent_contract.read_text()
          marker = "assert '/ws/live' in live\n"
          if marker not in text:
              raise SystemExit('Agent control contract marker not found')
          text = text.replace(
              marker,
              marker + "assert 'if row[\"kind\"] == \"certificate_issue\":' in agent\n"
                       + "assert 'if row[\"kind\"] == \"monitor_run\":' in agent\n"
                       + "assert 'plugin_deployments' in agent and 'fleet_operation_items' in agent\n",
              1,
          )
          agent_contract.write_text(text)
          PY
          git diff --check
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Verify source
        run: |
          python -m compileall -q hub agent tests
          for js in hub/static/*.js; do node --check "$js"; done
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py
          python tests/topology_refresh_contract.py
          python tests/view_render_contract.py
          python tests/frontend_core_contract.py
          python tests/topology_module_contract.py
          python tests/ssh_terminal_module_contract.py
          python tests/file_transfer_module_contract.py
          python tests/fleet_operations_module_contract.py
          python tests/monitoring_module_contract.py
          python tests/incident_management_module_contract.py
          python tests/tunnel_operations_module_contract.py
          python tests/action_router_module_contract.py
          python tests/frontend_runtime_contract.py
          python tests/backend_config_contract.py
          python tests/backend_schemas_contract.py
          python tests/backend_database_contract.py
          python tests/backend_bootstrap_contract.py
          python tests/backend_node_tunnel_repository_contract.py
          python tests/backend_monitor_incident_repository_contract.py
          python tests/backend_node_tunnel_service_contract.py
          python tests/backend_plugin_deployment_service_contract.py
          python tests/backend_monitor_incident_service_contract.py
          python tests/backend_certificate_fleet_service_contract.py
          python tests/backend_router_contract.py
          python tests/backend_node_tunnel_router_contract.py
          python tests/backend_operations_router_contract.py
          python tests/backend_auth_dashboard_system_router_contract.py
          python tests/backend_ssh_router_contract.py
          python tests/backend_jobs_system_router_contract.py
          python tests/backend_agent_control_router_contract.py
      - name: Verify reproducible release
        run: |
          scripts/build-release.sh
          first="$(mktemp -d)"; cp -a dist/. "$first/"
          scripts/build-release.sh
          diff -qr "$first" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.35.tar.gz | grep -q 'agent_control_router.py'
          tar -tzf dist/DARK-NOC-HUB-v2.9.35.tar.gz | grep -q 'live_router.py'
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub/agent_control_router.py hub/live_router.py hub/app.py agent/agent.py darknoc install-hub.sh install-node.sh upgrade.sh hub/static/index.html tests/*.py docs/backend-router-progress-v2.9.35.md RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'refactor: split Agent Control Plane and Live routers for v2.9.35'
          git push --force origin HEAD:refs/heads/release/v2.9.35-agent-control-live-router
