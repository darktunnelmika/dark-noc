name: DARK NOC v2.9.3 Topology Inventory Repair

on:
  push:
    branches: ["fix/topology-inventory-v2.9.3"]
    paths:
      - ".github/workflows/topology-inventory-v2.9.3.yml"
      - ".topology-bootstrap/**"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and apply topology inventory patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .topology-bootstrap/part00 .topology-bootstrap/part01 .topology-bootstrap/part02 \
              .topology-bootstrap/part03 .topology-bootstrap/part04 .topology-bootstrap/part05 \
              > /tmp/dark-noc-v2.9.3.b64
          base64 -d /tmp/dark-noc-v2.9.3.b64 > /tmp/dark-noc-v2.9.3.py.xz
          xz -t /tmp/dark-noc-v2.9.3.py.xz
          xz -dc /tmp/dark-noc-v2.9.3.py.xz > /tmp/apply_dark_noc_v2_9_3.py
          python -m py_compile /tmp/apply_dark_noc_v2_9_3.py
          python /tmp/apply_dark_noc_v2_9_3.py

      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py

      - name: Verify reproducible release archives
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated production source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/topology-inventory-v2.9.3.yml \
            .topology-bootstrap
          git add -A
          git diff --cached --check
          git commit -m "fix: restore Hub tunnels and rebuild topology graph"
          git push origin HEAD:fix/topology-inventory-v2.9.3
