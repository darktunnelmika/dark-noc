name: Prepare v2.9.9 modularization

on:
  workflow_dispatch:
  push:
    branches: [automation/v2.9.9-modularization]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract stable frontend core helpers
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('hub/static/app.js')
          text=app.read_text()
          old='''const $ = (selector, scope = document) => scope.querySelector(selector);\nconst $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];\n'''
          assert text.startswith(old)
          text=text.replace(old,"const { $, $$, esc, bytesPerSecond, fileSize, displayHost, relativeTime, duration, elapsedDuration } = window.DarkNocCore;\n",1)
          for block in [
          '''function esc(value) {\n  return String(value ?? '').replace(/[&<>'\"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[char]));\n}\n\n''',
          '''function bytesPerSecond(value) {\n  const n = Number(value || 0);\n  if (n >= 1e9) return `${(n / 1e9).toFixed(2)} Gb/s`;\n  if (n >= 1e6) return `${(n / 1e6).toFixed(0)} Mb/s`;\n  if (n >= 1e3) return `${(n / 1e3).toFixed(0)} Kb/s`;\n  return `${n.toFixed(0)} b/s`;\n}\n\nfunction fileSize(value) {\n  const bytes=Number(value||0),units=['B','KB','MB','GB','TB'];let size=bytes,index=0;\n  while(size>=1024&&index<units.length-1){size/=1024;index+=1;}\n  return `${size.toFixed(index?2:0)} ${units[index]}`;\n}\n\nfunction displayHost(value){return String(value||'').replace(/^::ffff:/,'')||'IP UNAVAILABLE';}\n\n''',
          '''function relativeTime(timestamp) {\n  if (!timestamp) return 'never';\n  const seconds = Math.max(0, Math.floor(Date.now() / 1000 - timestamp));\n  if (seconds < 10) return 'now';\n  if (seconds < 60) return `${seconds}s ago`;\n  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;\n  return `${Math.floor(seconds / 3600)}h ago`;\n}\n\nfunction duration(timestamp) {\n  const total=Math.max(0,Math.floor(Date.now()/1000-Number(timestamp||Date.now()/1000)));\n  const hours=Math.floor(total/3600), minutes=Math.floor(total%3600/60), seconds=total%60;\n  return [hours,minutes,seconds].map(value=>String(value).padStart(2,'0')).join(':');\n}\n\nfunction elapsedDuration(totalSeconds) {\n  const total=Math.max(0,Math.floor(Number(totalSeconds||0))),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),seconds=total%60;\n  return [hours,minutes,seconds].map(value=>String(value).padStart(2,'0')).join(':');\n}\n\n''']:
              assert block in text
              text=text.replace(block,'',1)
          app.write_text(text)

          core='''/* DARK NOC stable frontend core utilities. Keep dependency-free and side-effect free. */\n(() => {\n  'use strict';\n  const $ = (selector, scope = document) => scope.querySelector(selector);\n  const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];\n  const esc = value => String(value ?? '').replace(/[&<>'\"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',\"'\":'&#39;','\"':'&quot;'}[char]));\n  const bytesPerSecond = value => {\n    const n=Number(value||0);\n    if(n>=1e9)return `${(n/1e9).toFixed(2)} Gb/s`;\n    if(n>=1e6)return `${(n/1e6).toFixed(0)} Mb/s`;\n    if(n>=1e3)return `${(n/1e3).toFixed(0)} Kb/s`;\n    return `${n.toFixed(0)} b/s`;\n  };\n  const fileSize = value => {\n    const units=['B','KB','MB','GB','TB'];let size=Number(value||0),index=0;\n    while(size>=1024&&index<units.length-1){size/=1024;index+=1;}\n    return `${size.toFixed(index?2:0)} ${units[index]}`;\n  };\n  const displayHost = value => String(value||'').replace(/^::ffff:/,'')||'IP UNAVAILABLE';\n  const relativeTime = timestamp => {\n    if(!timestamp)return 'never';const seconds=Math.max(0,Math.floor(Date.now()/1000-timestamp));\n    if(seconds<10)return 'now';if(seconds<60)return `${seconds}s ago`;if(seconds<3600)return `${Math.floor(seconds/60)}m ago`;return `${Math.floor(seconds/3600)}h ago`;\n  };\n  const duration = timestamp => {const total=Math.max(0,Math.floor(Date.now()/1000-Number(timestamp||Date.now()/1000))),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),seconds=total%60;return [hours,minutes,seconds].map(value=>String(value).padStart(2,'0')).join(':');};\n  const elapsedDuration = totalSeconds => {const total=Math.max(0,Math.floor(Number(totalSeconds||0))),hours=Math.floor(total/3600),minutes=Math.floor(total%3600/60),seconds=total%60;return [hours,minutes,seconds].map(value=>String(value).padStart(2,'0')).join(':');};\n  window.DarkNocCore=Object.freeze({$, $$, esc, bytesPerSecond, fileSize, displayHost, relativeTime, duration, elapsedDuration});\n})();\n'''
          Path('hub/static/core.js').write_text(core)

          index=Path('hub/static/index.html')
          html=index.read_text()
          old='<script src="/static/app.js?v=2.9.8"></script>'
          assert old in html
          html=html.replace(old,'<script src="/static/core.js?v=1.0.0"></script>\n  <script src="/static/app.js?v=2.9.9"></script>',1)
          index.write_text(html)

          version_files=['hub/app.py','agent/agent.py','darknoc','install-hub.sh','install-node.sh','upgrade.sh','tests/agent_heartbeat_resilience.py','tests/installer_contracts.py','tests/local_hub_recovery.py','tests/realm_integration.py','tests/smoke.py','tests/topology_inventory_regression.py']
          for name in version_files:
              p=Path(name); t=p.read_text(); p.write_text(t.replace('2.9.8','2.9.9'))

          Path('tests/frontend_core_contract.py').write_text('''from pathlib import Path\ncore=Path("hub/static/core.js").read_text()\napp=Path("hub/static/app.js").read_text()\nindex=Path("hub/static/index.html").read_text()\nassert "window.DarkNocCore=Object.freeze" in core\nassert "const { $, $$, esc, bytesPerSecond, fileSize, displayHost, relativeTime, duration, elapsedDuration } = window.DarkNocCore;" in app\nassert "function esc(value)" not in app\nassert "function bytesPerSecond(value)" not in app\nassert index.index("/static/core.js?v=1.0.0") < index.index("/static/app.js?v=2.9.9")\nprint("Frontend core modularization contract passed")\n''')

          notes='''# DARK NOC v2.9.9 — Frontend Core Modularization\n\n- First safe modularization step: extract stable, dependency-free frontend helpers from app.js into core.js.\n- Keep all UI behavior and Live tunnel matrix visuals unchanged.\n- Load core.js before app.js and add regression coverage for the module boundary.\n- No API, tunnel, Agent, installer or database behavior changes beyond version synchronization.\n\n## فارسی\n\nاولین مرحله ماژولار کردن فرانت‌اند انجام شد: توابع پایه و مستقل از app.js به core.js منتقل شدند، بدون تغییر ظاهر یا رفتار پنل.\n\n---\n\n'''
          p=Path('RELEASE_NOTES.md');p.write_text(notes+p.read_text())
          p=Path('CHANGELOG.md');t=p.read_text();first,sep,rest=t.partition('\n');p.write_text(first+sep+'\n## 2.9.9 — Frontend core modularization\n\n- Extract stable frontend helpers into core.js.\n- Preserve current UI and topology behavior.\n- Add module-boundary regression coverage.\n\n'+rest)
          PY
          git diff --check
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Verify source
        run: |
          python -m compileall -q hub agent tests
          node --check hub/static/core.js
          node --check hub/static/app.js
          node --check hub/static/live-matrix.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py
          python tests/topology_refresh_contract.py
          python tests/view_render_contract.py
          python tests/frontend_core_contract.py
      - name: Verify reproducible release
        run: |
          scripts/build-release.sh
          first="$(mktemp -d)"
          cp -a dist/. "$first/"
          scripts/build-release.sh
          diff -qr "$first" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.9.tar.gz | grep -q 'core.js'
      - name: Commit verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub/static/core.js hub/static/app.js hub/static/index.html hub/app.py agent/agent.py darknoc install-hub.sh install-node.sh upgrade.sh tests/*.py RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'refactor(frontend): extract stable core helpers for v2.9.9'
          git push origin HEAD:refs/heads/release/v2.9.9-modularization
