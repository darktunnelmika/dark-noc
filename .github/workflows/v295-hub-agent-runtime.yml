name: DARK NOC v2.9.5 Hub Agent Runtime Repair

on:
  push:
    branches: ["fix/hub-agent-runtime-v2.9.5"]
    paths:
      - ".github/workflows/v295-hub-agent-runtime.yml"
      - ".v295-bootstrap/apply_v295.py"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v2.9.5 repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          patcher = Path('.v295-bootstrap/apply_v295.py')
          source = patcher.read_text(encoding='utf-8')

          old = '''upgrade = replace_once(
              upgrade, old_agent_restore, new_agent_restore,
              "Hub success path Agent-state repair",
          )
          write("upgrade.sh", upgrade)
          '''
          new = '''hub_install_anchor = '    bash "$SCRIPT_DIR/install-hub.sh"\\n'
          agent_case_anchor = '    ;;\\n  agent)'
          if upgrade.count(hub_install_anchor) != 1 or upgrade.count(agent_case_anchor) != 1:
              raise SystemExit("Hub upgrade success-path boundaries mismatch")
          upgrade_prefix, after_install = upgrade.split(hub_install_anchor, 1)
          hub_success, upgrade_suffix = after_install.split(agent_case_anchor, 1)
          hub_success = replace_once(
              hub_success, old_agent_restore, new_agent_restore,
              "Hub success path Agent-state repair",
          )
          upgrade = (
              upgrade_prefix + hub_install_anchor + hub_success
              + agent_case_anchor + upgrade_suffix
          )
          write("upgrade.sh", upgrade)
          '''
          if source.count(old) != 1:
              raise SystemExit('Patch bootstrap success-path anchor mismatch')
          source = source.replace(old, new, 1)

          css_start = source.index('styles = read("hub/static/styles.css")')
          css_end = source.index('styles = replace_once(', css_start)
          css_replacement = '''styles = read("hub/static/styles.css")
          old_backbone_css = ".cyber-route-backbone{fill:none;stroke:currentColor;stroke-width:var(--route-width,1.8);stroke-linecap:round;opacity:.58;filter:url(#cyber-glow);pointer-events:none;vector-effect:non-scaling-stroke;transition:opacity .18s,stroke-width .18s}"
          new_backbone_css = ".cyber-route-backbone{fill:none;stroke:currentColor;stroke-width:calc(var(--route-width,1.8) + .55);stroke-linecap:round;opacity:.92;filter:url(#cyber-glow);pointer-events:none;vector-effect:non-scaling-stroke;transition:opacity .18s,stroke-width .18s}"
          styles = replace_once(
              styles, old_backbone_css, new_backbone_css,
              "Topology solid backbone CSS",
          )
          old_flow_css = ".cyber-route-flow{fill:none;stroke:currentColor;stroke-width:calc(var(--route-width,1.8) + .9);stroke-linecap:round;stroke-dasharray:13 87;stroke-dashoffset:100;opacity:.96;filter:url(#cyber-glow);pointer-events:none;vector-effect:non-scaling-stroke;animation:route-data-flow var(--flow-duration,3s) linear infinite}"
          new_flow_css = ".cyber-route-flow{fill:none;stroke:currentColor;stroke-width:calc(var(--route-width,1.8) + 2.1);stroke-linecap:round;opacity:.34;filter:url(#cyber-glow);pointer-events:none;vector-effect:non-scaling-stroke;animation:route-energy-pulse var(--flow-duration,3s) ease-in-out infinite}"
          styles = replace_once(
              styles, old_flow_css, new_flow_css,
              "Topology solid energy CSS",
          )
          '''
          source = source[:css_start] + css_replacement + source[css_end:]
          patcher.write_text(source, encoding='utf-8')
          PY
          python -m py_compile .v295-bootstrap/apply_v295.py
          python .v295-bootstrap/apply_v295.py

      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        run: |
          set -euo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py

      - name: Verify reproducible release archives
        run: |
          set -euo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .v295-bootstrap
          git restore --source=HEAD -- .github/workflows/v295-hub-agent-runtime.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: keep Hub Agent online and restore solid live routes"
          git push origin HEAD:fix/hub-agent-runtime-v2.9.5
