name: DARK NOC v2.9.5 Hub Agent Runtime Repair

on:
  push:
    branches: ["fix/hub-agent-runtime-v2.9.5"]
    paths:
      - ".github/workflows/v295-hub-agent-runtime.yml"
      - ".v295-bootstrap/apply_v295.py"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply v2.9.5 repair
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          patcher = Path('.v295-bootstrap/apply_v295.py')
          source = patcher.read_text(encoding='utf-8')

          old = '''upgrade = replace_once(
              upgrade, old_agent_restore, new_agent_restore,
              "Hub success path Agent-state repair",
          )
          write("upgrade.sh", upgrade)
          '''
          new = '''hub_install_anchor = '    bash "$SCRIPT_DIR/install-hub.sh"\\n'
          agent_case_anchor = '    ;;\\n  agent)'
          if upgrade.count(hub_install_anchor) != 1 or upgrade.count(agent_case_anchor) != 1:
              raise SystemExit("Hub upgrade success-path boundaries mismatch")
          upgrade_prefix, after_install = upgrade.split(hub_install_anchor, 1)
          hub_success, upgrade_suffix = after_install.split(agent_case_anchor, 1)
          hub_success = replace_once(
              hub_success, old_agent_restore, new_agent_restore,
              "Hub success path Agent-state repair",
          )
          upgrade = (
              upgrade_prefix + hub_install_anchor + hub_success
              + agent_case_anchor + upgrade_suffix
          )
          write("upgrade.sh", upgrade)
          '''
          if source.count(old) != 1:
              raise SystemExit('Patch bootstrap success-path anchor mismatch')
          source = source.replace(old, new, 1)

          old_backbone = r'backbone_pattern = re.compile(r"\\.cyber-route-backbone\\{[^}]+\\}")'
          new_backbone = r'backbone_pattern = re.compile(r"\.cyber-route-backbone\{[^}]+\}")'
          old_flow = r'flow_pattern = re.compile(r"\\.cyber-route-flow\\{[^}]+\\}")'
          new_flow = r'flow_pattern = re.compile(r"\.cyber-route-flow\{[^}]+\}")'
          if source.count(old_backbone) != 1 or source.count(old_flow) != 1:
              raise SystemExit('Topology CSS regex bootstrap anchor mismatch')
          source = source.replace(old_backbone, new_backbone, 1)
          source = source.replace(old_flow, new_flow, 1)

          patcher.write_text(source, encoding='utf-8')
          PY
          python -m py_compile .v295-bootstrap/apply_v295.py
          python .v295-bootstrap/apply_v295.py

      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        run: |
          set -euo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py

      - name: Verify reproducible release archives
        run: |
          set -euo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated production source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .v295-bootstrap
          git restore --source=HEAD -- .github/workflows/v295-hub-agent-runtime.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: keep Hub Agent online and restore solid live routes"
          git push origin HEAD:fix/hub-agent-runtime-v2.9.5
