name: Validate v2.9.45 Plugin Contract v1

on:
  push:
    branches: [automation/v2.9.45-plugin-registry]

permissions:
  contents: write

concurrency:
  group: dark-noc-v2.9.45-plugin-registry
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: automation/v2.9.45-plugin-registry
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply Plugin Contract v1 transform
        run: |
          set -Eeuo pipefail
          python scripts/prepare-v2.9.45-plugin-registry.py
          python - <<'PY'
          import textwrap
          from pathlib import Path

          path = Path('agent/agent.py')
          text = path.read_text()

          old = textwrap.dedent('''\
          def monitored_tunnels(config: dict[str, Any]) -> list[dict[str, Any]]:
              managed_services = {str(item) for item in config.get("managed_services", []) if str(item)}
              explicit = [
                  item for item in config.get("tunnels", [])
                  if str(item.get("service", "")) in managed_services
              ]
          ''')
          new = textwrap.dedent('''\
          def monitored_tunnels(config: dict[str, Any]) -> list[dict[str, Any]]:
              managed_services = {str(item) for item in config.get("managed_services", []) if str(item)}

              def explicit_managed(item: dict[str, Any]) -> bool:
                  service = str(item.get("service", ""))
                  method = str(item.get("method", ""))
                  if service in managed_services:
                      return True
                  return bool(
                      method in {"DARK Backhaul", "DARK Ghost Pro", "DARK Packet Pro", "DARK Realm Pro"}
                      and (
                          DARK_BACKHAUL_SERVICE_PATTERN.fullmatch(service)
                          or GHOSTPRO_SERVICE_PATTERN.fullmatch(service)
                          or PACKETPRO_SERVICE_PATTERN.fullmatch(service)
                          or REALM_SERVICE_PATTERN.fullmatch(service)
                      )
                  )

              explicit = [item for item in config.get("tunnels", []) if explicit_managed(item)]
          ''')
          if text.count(old) != 1:
              raise SystemExit('monitored_tunnels Plugin Contract boundary changed')
          text = text.replace(old, new, 1)

          inventory_start = text.index('def plugin_inventory() -> dict[str, Any]:')
          inventory_end = text.index('\ndef restart_allowed(', inventory_start)
          inventory_runtime = textwrap.dedent('''\
          def _binary_plugin_inventory(
              core: Path,
              version_args: list[str],
              method: str,
              tunnels: list[dict[str, Any]],
          ) -> dict[str, Any]:
              installed = core.is_file() and os.access(core, os.X_OK)
              version = None
              if installed:
                  code, output = run([str(core), *version_args], timeout=8)
                  version = (output.strip().splitlines() or ["unknown"])[-1][:120] if code == 0 else "unknown"
              return {
                  "installed": installed,
                  "version": version,
                  "instances": sum(item.get("method") == method for item in tunnels),
              }


          def plugin_inventory() -> dict[str, Any]:
              tunnels = discover_tunnels()
              return {
                  str(adapter["inventory_key"]): adapter["inventory"](tunnels)
                  for adapter in plugin_adapters().values()
              }
          ''')
          text = text[:inventory_start] + inventory_runtime + text[inventory_end + 1:]

          adapter_start = text.index('def plugin_adapter(plugin_id: str) -> dict[str, Any]:')
          adapter_end = text.index('\ndef execute_job(', adapter_start)
          adapter_runtime = textwrap.dedent('''\
          def plugin_adapters() -> dict[str, dict[str, Any]]:
              """Native plugin capabilities live in one privileged Agent registry."""
              return {
                  "dark-backhaul": {
                      "name": "DARK Backhaul", "inventory_key": "dark_backhaul", "service_prefix": "backhaul@",
                      "inventory": lambda tunnels: _binary_plugin_inventory(Path("/usr/local/bin/backhaul"), ["-v"], "DARK Backhaul", tunnels),
                      "install": _install_darkbh_core,
                      "deploy": lambda payload, config: _deploy_dark_backhaul(payload, config),
                      "remove": lambda payload, config: _remove_dark_backhaul(payload, config),
                  },
                  "dark-ghostpro": {
                      "name": "DARK Ghost Pro", "inventory_key": "dark_ghostpro", "service_prefix": "ghostpro@",
                      "inventory": lambda tunnels: _binary_plugin_inventory(Path("/usr/local/bin/gost"), ["-V"], "DARK Ghost Pro", tunnels),
                      "install": _install_gost_core,
                      "deploy": lambda payload, config: _deploy_dark_ghost(payload, config),
                      "remove": lambda payload, config: _remove_dark_ghost(payload, config),
                  },
                  "dark-packetpro": {
                      "name": "DARK Packet Pro", "inventory_key": "dark_packetpro", "service_prefix": "paqetpro@",
                      "inventory": lambda tunnels: _binary_plugin_inventory(Path("/usr/local/bin/paqet"), ["version"], "DARK Packet Pro", tunnels),
                      "install": _install_paqet_core,
                      "deploy": lambda payload, config: _deploy_dark_packet(payload, config),
                      "remove": lambda payload, config: _remove_dark_packet(payload, config),
                  },
                  "dark-realm": {
                      "name": "DARK Realm Pro", "inventory_key": "dark_realm", "service_prefix": "dark-realm@",
                      "inventory": lambda tunnels: {**realm_inventory(), "instances": sum(item.get("method") == "DARK Realm Pro" for item in tunnels)},
                      "install": install_dark_realm,
                      "deploy": lambda payload, config: deploy_dark_realm(payload, config, CONFIG_PATH),
                      "remove": lambda payload, config: remove_dark_realm(payload, config, CONFIG_PATH),
                  },
              }


          def plugin_adapter(plugin_id: str) -> dict[str, Any]:
              adapter = plugin_adapters().get(plugin_id)
              if not adapter:
                  raise ValueError("Plugin is not supported by this Agent build")
              return adapter
          ''')
          text = text[:adapter_start] + adapter_runtime + text[adapter_end + 1:]
          path.write_text(text)

          replacements = (
              ('install-node.sh', 'Zero-touch Node v2.9.44', 'Zero-touch Node v2.9.45'),
              ('install-hub.sh', "row[1] == '2.9.44'", "row[1] == '2.9.45'"),
              ('install-hub.sh', 'fresh v2.9.44 heartbeat', 'fresh v2.9.45 heartbeat'),
              ('upgrade.sh', 'row[1] == "2.9.44"', 'row[1] == "2.9.45"'),
              ('upgrade.sh', 'fresh v2.9.44 post-upgrade pulse', 'fresh v2.9.45 post-upgrade pulse'),
              ('hub/static/index.html', 'plugin-actions.js?v=1.0.0', 'plugin-actions.js?v=1.1.0'),
              ('hub/static/index.html', 'app.js?v=2.9.44', 'app.js?v=2.9.45'),
          )
          for filename, old_marker, new_marker in replacements:
              target = Path(filename)
              source = target.read_text()
              if source.count(old_marker) != 1:
                  raise SystemExit(f'{filename}: expected exactly one marker {old_marker!r}')
              target.write_text(source.replace(old_marker, new_marker, 1))
          PY
          git diff --check

      - name: Install locked dependencies
        run: |
          pip install --disable-pip-version-check --require-hashes -r hub/requirements.lock
          pip install --disable-pip-version-check --require-hashes -r agent/requirements.lock
          pip check

      - name: Static validation
        run: |
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          node --check hub/static/plugin-actions.js
          node --check hub/static/ops-actions.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Plugin architecture tests
        run: |
          python tests/plugin_registry_contract.py
          python tests/backend_plugin_deployment_service_contract.py
          python tests/backend_router_contract.py
          python tests/agent_logic.py
          python tests/noc_features.py
          python tests/smoke.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/installer_contracts.py
          python tests/frontend_runtime_contract.py
          python tests/github_actions_supply_chain_contract.py
          python tests/dependency_lock_contract.py

      - name: Reproducible release validation
        run: |
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.45.tar.gz | grep -q 'dark-noc-pro/hub/plugins/dark-backhaul.json'
          tar -tzf dist/DARK-NOC-HUB-v2.9.45.tar.gz | grep -q 'dark-noc-pro/hub/plugin_registry.py'

      - name: Publish verified candidate branch
        run: |
          set -Eeuo pipefail
          candidate_patch="$(mktemp)"
          git diff --binary origin/main -- . \
            ':(exclude).github/workflows/automation-v2.9.45-plugin-registry.yml' \
            ':(exclude).github/workflows/ci.yml' \
            ':(exclude).github/workflows/release.yml' \
            ':(exclude)scripts/prepare-v2.9.45-plugin-registry.py' > "$candidate_patch"
          git reset --hard origin/main
          git clean -fdx
          git checkout -B release/v2.9.45-plugin-registry origin/main
          git apply --index "$candidate_patch"
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'DARK NOC v2.9.45 — Plugin Contract v1'
          git push --force-with-lease origin HEAD:refs/heads/release/v2.9.45-plugin-registry
