name: Prepare v2.9.19 Backend Config modularization

on:
  push:
    branches: [automation/v2.9.19-backend-config]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract backend runtime configuration
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('hub/app.py')
          text=app.read_text()

          start=text.index('def bounded_env_int(')
          end=text.index('SSH_FILE_CHUNK =', start)
          block=text[start:end]

          fn_start=block.index('def bounded_env_int(')
          const_start=block.index('SSH_UPLOAD_LIMIT =')
          functions=block[fn_start:const_start].rstrip()+"\n"
          constants=block[const_start:].rstrip()+"\n"

          config=(
              'from __future__ import annotations\n\n'
              'import os\n\n'
              + functions + '\n' + constants
          )
          Path('hub/runtime_config.py').write_text(config)

          text=text[:start]+text[end:]
          import_anchor='from pydantic import BaseModel, Field, field_validator\n'
          assert import_anchor in text
          config_import=(
              "\ntry:\n"
              "    from .runtime_config import (\n"
              "        HUB_LEASE_SECONDS, METRIC_RAW_RETENTION_DAYS, METRIC_ROLLUP_RETENTION_DAYS,\n"
              "        MONITOR_RESULT_RETENTION_DAYS, NODE_PROVISION_CONCURRENCY, NODE_PROVISION_TIMEOUT,\n"
              "        SSH_EDITOR_LIMIT, SSH_KEEPALIVE_COUNT_MAX, SSH_KEEPALIVE_INTERVAL, SSH_RELAY_LIMIT,\n"
              "        SSH_TRANSFER_CONCURRENCY, SSH_TRANSFER_IDLE_TIMEOUT, SSH_TRANSFER_TIMEOUT,\n"
              "        SSH_UPLOAD_LIMIT, SSH_UPLOAD_QUEUE_TIMEOUT, TUNNEL_SAMPLE_RETENTION_DAYS,\n"
              "        bounded_env_int, configured_public_hub_url,\n"
              "    )\n"
              "except ImportError:\n"
              "    from runtime_config import (\n"
              "        HUB_LEASE_SECONDS, METRIC_RAW_RETENTION_DAYS, METRIC_ROLLUP_RETENTION_DAYS,\n"
              "        MONITOR_RESULT_RETENTION_DAYS, NODE_PROVISION_CONCURRENCY, NODE_PROVISION_TIMEOUT,\n"
              "        SSH_EDITOR_LIMIT, SSH_KEEPALIVE_COUNT_MAX, SSH_KEEPALIVE_INTERVAL, SSH_RELAY_LIMIT,\n"
              "        SSH_TRANSFER_CONCURRENCY, SSH_TRANSFER_IDLE_TIMEOUT, SSH_TRANSFER_TIMEOUT,\n"
              "        SSH_UPLOAD_LIMIT, SSH_UPLOAD_QUEUE_TIMEOUT, TUNNEL_SAMPLE_RETENTION_DAYS,\n"
              "        bounded_env_int, configured_public_hub_url,\n"
              "    )\n"
          )
          text=text.replace(import_anchor, import_anchor+config_import, 1)
          app.write_text(text)

          test=Path('tests/backend_config_contract.py')
          test.write_text("""from pathlib import Path
root=Path(__file__).resolve().parents[1]
app=(root/'hub/app.py').read_text()
config=(root/'hub/runtime_config.py').read_text()
for marker in ['def bounded_env_int(', 'def configured_public_hub_url(', 'SSH_UPLOAD_LIMIT =', 'SSH_RELAY_LIMIT =', 'NODE_PROVISION_TIMEOUT =', 'HUB_LEASE_SECONDS =']:
    assert marker in config
    assert marker not in app
assert 'from .runtime_config import (' in app
assert 'from runtime_config import (' in app
assert 'VERSION = "2.9.19"' in app
print('Backend runtime configuration module boundary passed')
""")

          ci=Path('.github/workflows/ci.yml')
          c=ci.read_text()
          needle='          python tests/action_router_module_contract.py\n          python tests/frontend_runtime_contract.py\n'
          assert needle in c
          c=c.replace(needle, needle+'          python tests/backend_config_contract.py\n', 1)
          ci.write_text(c)

          version_files=[
              'hub/app.py','agent/agent.py','darknoc','install-hub.sh','install-node.sh','upgrade.sh',
              'hub/static/index.html','tests/agent_heartbeat_resilience.py','tests/installer_contracts.py',
              'tests/local_hub_recovery.py','tests/realm_integration.py','tests/smoke.py','tests/topology_inventory_regression.py'
          ]
          for name in version_files:
              p=Path(name); value=p.read_text()
              if '2.9.18' in value:
                  p.write_text(value.replace('2.9.18','2.9.19'))

          notes='# DARK NOC v2.9.19 — Backend Runtime Configuration Module\n\n- Start backend modularization by extracting environment parsing and runtime limits from hub/app.py into hub/runtime_config.py.\n- Preserve VERSION and process-local runtime state in app.py.\n- Keep all API routes, database behavior, Agent behavior and frontend visuals unchanged.\n- Add a permanent backend module-boundary regression contract.\n\n## فارسی\n\nاولین مرحله ماژولار کردن بک‌اند انجام شد: تنظیمات محیطی و محدودیت‌های Runtime از hub/app.py به hub/runtime_config.py منتقل شدند، بدون تغییر API یا رفتار پنل.\n\n---\n\n'
          p=Path('RELEASE_NOTES.md'); p.write_text(notes+p.read_text())
          p=Path('CHANGELOG.md'); old=p.read_text(); first,sep,rest=old.partition('\n'); p.write_text(first+sep+'\n## 2.9.19 — Backend runtime configuration module\n\n- Extract environment parsing and runtime limits from hub/app.py into hub/runtime_config.py.\n- Preserve APIs and runtime behavior.\n- Add backend module-boundary regression coverage.\n\n'+rest)
          PY
          git diff --check
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Verify source
        run: |
          python -m compileall -q hub agent tests
          for js in hub/static/*.js; do node --check "$js"; done
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py
          python tests/topology_refresh_contract.py
          python tests/view_render_contract.py
          python tests/frontend_core_contract.py
          python tests/topology_module_contract.py
          python tests/ssh_terminal_module_contract.py
          python tests/file_transfer_module_contract.py
          python tests/fleet_operations_module_contract.py
          python tests/monitoring_module_contract.py
          python tests/incident_management_module_contract.py
          python tests/tunnel_operations_module_contract.py
          python tests/action_router_module_contract.py
          python tests/frontend_runtime_contract.py
          python tests/backend_config_contract.py
      - name: Verify reproducible release
        run: |
          scripts/build-release.sh
          first="$(mktemp -d)"; cp -a dist/. "$first/"
          scripts/build-release.sh
          diff -qr "$first" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.19.tar.gz | grep -q 'runtime_config.py'
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub/runtime_config.py hub/app.py agent/agent.py darknoc install-hub.sh install-node.sh upgrade.sh hub/static/index.html tests/*.py .github/workflows/ci.yml RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'refactor: extract backend runtime config for v2.9.19'
          git push origin HEAD:refs/heads/release/v2.9.19-backend-config
