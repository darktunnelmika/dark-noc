name: Prepare v2.9.17 Action Router retry

on:
  push:
    branches: [automation/v2.9.17-action-router]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/v2.9.17-action-router
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reuse transform and update contracts
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/prepare-v2.9.17-action-router.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(wf) if "python - <<'PY'" in line)+1
          end=next(i for i in range(start,len(wf)) if wf[i].strip()=='PY')
          block='\n'.join(line[10:] if line.startswith('          ') else line for line in wf[start:end])
          exec(compile(block,'v2.9.17-transform','exec'))

          patches={
            'tests/fleet_operations_module_contract.py':("app=(root/'hub/static/app.js').read_text()","app=(root/'hub/static/app.js').read_text()\nops=(root/'hub/static/ops-actions.js').read_text()", "assert 'data-fleet-output' in app and 'fleetCancel' in app", "assert 'data-fleet-output' in ops and 'fleetCancel' in ops"),
            'tests/monitoring_module_contract.py':("app=(root/'hub/static/app.js').read_text()","app=(root/'hub/static/app.js').read_text()\nops=(root/'hub/static/ops-actions.js').read_text()", "assert 'monitorRun' in app and 'monitorHistory' in app and 'monitorEdit' in app and 'monitorDelete' in app", "assert 'monitorRun' in ops and 'monitorHistory' in ops and 'monitorEdit' in ops and 'monitorDelete' in ops"),
            'tests/incident_management_module_contract.py':("app=(root/'hub/static/app.js').read_text()","app=(root/'hub/static/app.js').read_text()\nops=(root/'hub/static/ops-actions.js').read_text()", "    assert marker in app", "    assert marker in ops"),
            'tests/tunnel_operations_module_contract.py':("app=(root/'hub/static/app.js').read_text()","app=(root/'hub/static/app.js').read_text()\nactions=(root/'hub/static/tunnel-actions.js').read_text()", "    assert marker in app", "    assert marker in actions"),
          }
          for name,(a,b,c,d) in patches.items():
              p=Path(name);t=p.read_text();assert a in t and c in t,name;p.write_text(t.replace(a,b,1).replace(c,d,1))
          PY
          git diff --check
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Verify source
        run: |
          python -m compileall -q hub agent tests
          for js in hub/static/core.js hub/static/topology.js hub/static/ssh-terminal.js hub/static/file-transfer.js hub/static/fleet-operations.js hub/static/monitoring.js hub/static/incident-management.js hub/static/tunnel-operations.js hub/static/node-actions.js hub/static/plugin-actions.js hub/static/tunnel-actions.js hub/static/ops-actions.js hub/static/app.js hub/static/live-matrix.js; do node --check "$js"; done
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py
          python tests/topology_refresh_contract.py
          python tests/view_render_contract.py
          python tests/frontend_core_contract.py
          python tests/topology_module_contract.py
          python tests/ssh_terminal_module_contract.py
          python tests/file_transfer_module_contract.py
          python tests/fleet_operations_module_contract.py
          python tests/monitoring_module_contract.py
          python tests/incident_management_module_contract.py
          python tests/tunnel_operations_module_contract.py
          python tests/action_router_module_contract.py
      - name: Verify reproducible release
        run: |
          scripts/build-release.sh
          first="$(mktemp -d)"
          cp -a dist/. "$first/"
          scripts/build-release.sh
          diff -qr "$first" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.17.tar.gz > /tmp/darknoc-hub-files
          for file in node-actions.js plugin-actions.js tunnel-actions.js ops-actions.js; do grep -q "$file" /tmp/darknoc-hub-files; done
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub/static/*.js hub/static/index.html tests/*.py hub/app.py agent/agent.py darknoc install-hub.sh install-node.sh upgrade.sh RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'refactor: split delegated action router for v2.9.17'
          git push --force-with-lease origin HEAD:refs/heads/release/v2.9.17-action-router
