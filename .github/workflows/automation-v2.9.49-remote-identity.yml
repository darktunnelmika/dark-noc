name: Prepare v2.9.49 Remote Identity

on:
  push:
    branches:
      - fix/v2.9.49-persistent-remote-identity

permissions:
  contents: write

concurrency:
  group: prepare-v2.9.49-remote-identity
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Apply v2.9.49 hotfix
        run: python scripts/prepare-v2.9.49-remote-identity.py

      - name: Install locked dependencies
        run: |
          pip install --disable-pip-version-check --require-hashes -r hub/requirements.lock
          pip install --disable-pip-version-check --require-hashes -r agent/requirements.lock
          pip check

      - name: Validate hotfix
        run: |
          python -m compileall -q hub agent tests
          node --check hub/static/topology.js
          node --check hub/static/app.js
          bash -n darknoc
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          python tests/topology_inventory_regression.py
          python tests/backend_schemas_contract.py
          python tests/plugin_registry_contract.py
          python tests/runtime_security_contract.py
          python tests/mobile_responsive_contract.py
          python tests/installer_contracts.py

      - name: Commit clean release candidate
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "DARK NOC v2.9.49 — Persistent Remote Identity"
          git push origin HEAD:fix/v2.9.49-persistent-remote-identity
