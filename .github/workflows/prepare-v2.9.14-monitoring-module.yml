name: Prepare v2.9.14 Monitoring modularization

on:
  push:
    branches: [automation/v2.9.14-monitoring-workflow]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extract Synthetic Monitoring module
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('hub/static/app.js')
          text=app.read_text()

          start=text.index('function renderMonitors(){')
          end=text.index('function tunnelHistoryChart(', start)
          runtime=text[start:end].rstrip()+'\n\n'
          for marker in ['function renderMonitors(){','function openMonitorEditor(']: assert marker in runtime, marker
          text=text[:start]+text[end:]

          start=text.index("$('#add-monitor').addEventListener('click',()=>openMonitorEditor());")
          end=text.index("$('#incident-note-form').addEventListener", start)
          bindings=text[start:end].rstrip()+'\n'
          for marker in ["$('#add-monitor').addEventListener", "$('#monitor-form').addEventListener('submit'", "$('#run-all-monitors').addEventListener"]: assert marker in bindings, marker
          text=text[:start]+text[end:]
          app.write_text(text)

          Path('hub/static/monitoring.js').write_text('// DARK NOC Synthetic Monitoring runtime. Classic-script globals are intentional.\n'+runtime+bindings)

          index=Path('hub/static/index.html')
          html=index.read_text()
          needle='  <script src="/static/fleet-operations.js?v=1.0.0"></script>\n  <script src="/static/app.js?v=2.9.13"></script>'
          assert needle in html
          index.write_text(html.replace(needle,'  <script src="/static/fleet-operations.js?v=1.0.0"></script>\n  <script src="/static/monitoring.js?v=1.0.0"></script>\n  <script src="/static/app.js?v=2.9.14"></script>',1))

          contract=("from pathlib import Path\nroot=Path(__file__).resolve().parents[1]\napp=(root/'hub/static/app.js').read_text()\nmon=(root/'hub/static/monitoring.js').read_text()\nindex=(root/'hub/static/index.html').read_text()\nfor marker in ['function renderMonitors(){','function openMonitorEditor(',\"$('#add-monitor').addEventListener\",\"$('#monitor-form').addEventListener('submit'\",\"$('#run-all-monitors').addEventListener\"]:\n    assert marker in mon\n    assert marker not in app\nassert 'monitorRun' in app and 'monitorHistory' in app and 'monitorEdit' in app and 'monitorDelete' in app\nassert index.index('fleet-operations.js') < index.index('monitoring.js') < index.index('app.js')\nprint('Synthetic Monitoring module boundary passed')\n")
          Path('tests/monitoring_module_contract.py').write_text(contract)

          version_files=['hub/app.py','agent/agent.py','darknoc','install-hub.sh','install-node.sh','upgrade.sh','tests/agent_heartbeat_resilience.py','tests/installer_contracts.py','tests/local_hub_recovery.py','tests/realm_integration.py','tests/smoke.py','tests/topology_inventory_regression.py']
          for name in version_files:
              p=Path(name); value=p.read_text()
              if '2.9.13' in value: p.write_text(value.replace('2.9.13','2.9.14'))

          notes='# DARK NOC v2.9.14 — Synthetic Monitoring Module Extraction\n\n- Extract monitor rendering, editor and form runtime from app.js into monitoring.js.\n- Preserve ICMP/TCP/HTTP/HTTPS/DNS/TLS/SNMP checks, run-all behavior and monitor configuration.\n- Keep delegated monitor actions, incidents, Fleet, SSH, File Manager, Matrix, APIs and Agent behavior unchanged.\n- Add permanent module-boundary regression coverage.\n\n## فارسی\n\nمرحله ششم ماژولار کردن فرانت‌اند انجام شد: منطق Synthetic Monitoring از app.js به monitoring.js منتقل شد، بدون تغییر ظاهر یا رفتار پنل.\n\n---\n\n'
          p=Path('RELEASE_NOTES.md'); p.write_text(notes+p.read_text())
          p=Path('CHANGELOG.md'); old=p.read_text(); first,sep,rest=old.partition('\n'); p.write_text(first+sep+'\n## 2.9.14 — Synthetic Monitoring module extraction\n\n- Extract monitor rendering/editor/form runtime into monitoring.js.\n- Preserve all synthetic check kinds and run-all behavior.\n- Add permanent module-boundary regression coverage.\n\n'+rest)
          PY
          git diff --check
      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt
      - name: Verify source
        run: |
          python -m compileall -q hub agent tests
          node --check hub/static/core.js
          node --check hub/static/topology.js
          node --check hub/static/ssh-terminal.js
          node --check hub/static/file-transfer.js
          node --check hub/static/fleet-operations.js
          node --check hub/static/monitoring.js
          node --check hub/static/app.js
          node --check hub/static/live-matrix.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/realm_runtime_regression.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py
          python tests/topology_refresh_contract.py
          python tests/view_render_contract.py
          python tests/frontend_core_contract.py
          python tests/topology_module_contract.py
          python tests/ssh_terminal_module_contract.py
          python tests/file_transfer_module_contract.py
          python tests/fleet_operations_module_contract.py
          python tests/monitoring_module_contract.py
      - name: Verify reproducible release
        run: |
          scripts/build-release.sh
          first="$(mktemp -d)"
          cp -a dist/. "$first/"
          scripts/build-release.sh
          diff -qr "$first" dist
          tar -tzf dist/DARK-NOC-HUB-v2.9.14.tar.gz > /tmp/darknoc-hub-files
          grep -q 'monitoring.js' /tmp/darknoc-hub-files
      - name: Commit verified candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hub/static/monitoring.js hub/static/app.js hub/static/index.html tests/monitoring_module_contract.py hub/app.py agent/agent.py darknoc install-hub.sh install-node.sh upgrade.sh tests/*.py RELEASE_NOTES.md CHANGELOG.md
          git commit -m 'refactor: extract Synthetic Monitoring runtime for v2.9.14'
          git push origin HEAD:refs/heads/release/v2.9.14-monitoring-module
