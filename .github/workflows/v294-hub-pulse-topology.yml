name: DARK NOC v2.9.4 Hub Pulse & Live Topology

on:
  push:
    branches: ["fix/hub-pulse-topology-v2.9.4"]
    paths:
      - ".github/workflows/v294-hub-pulse-topology.yml"
      - ".v294-bootstrap/apply_v294.py.xz"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore and apply v2.9.4 repair
        shell: bash
        run: |
          set -euo pipefail
          xz -t .v294-bootstrap/apply_v294.py.xz
          xz -dc .v294-bootstrap/apply_v294.py.xz > /tmp/apply_v294.py
          python - <<'PY'
          from pathlib import Path
          patcher = Path('/tmp/apply_v294.py')
          source = patcher.read_text(encoding='utf-8')
          old = 'ROOT = Path(__file__).resolve().parents[1]'
          if source.count(old) != 1:
              raise SystemExit('v2.9.4 patcher root anchor mismatch')
          patcher.write_text(source.replace(old, 'ROOT = Path.cwd()'), encoding='utf-8')
          PY
          python -m py_compile /tmp/apply_v294.py
          python /tmp/apply_v294.py

      - name: Install dependencies
        run: pip install -r hub/requirements.txt -r agent/requirements.txt

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q hub agent tests
          node --check hub/static/app.js
          for script in *.sh scripts/*.sh; do bash -n "$script"; done
          bash -n darknoc

      - name: Full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/smoke.py
          python tests/agent_logic.py
          python tests/file_ops.py
          python tests/noc_features.py
          python tests/server_cli.py
          python tests/realm_integration.py
          python tests/local_hub_recovery.py
          python tests/installer_contracts.py
          python tests/agent_heartbeat_resilience.py
          python tests/topology_inventory_regression.py

      - name: Verify reproducible release archives
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-release.sh
          first_build="$(mktemp -d)"
          cp -a dist/. "$first_build/"
          scripts/build-release.sh
          diff -qr "$first_build" dist

      - name: Publish validated production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .v294-bootstrap
          git restore --source=HEAD -- .github/workflows/v294-hub-pulse-topology.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: isolate Hub liveness and restore live topology flow"
          git push origin HEAD:fix/hub-pulse-topology-v2.9.4
